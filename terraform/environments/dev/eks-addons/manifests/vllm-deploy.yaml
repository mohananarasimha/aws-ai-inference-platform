apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: default

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: vllm

  template:
    metadata:
      labels:
        app: vllm

    spec:
      # A Service named "vllm" would inject VLLM_PORT=tcp://..., which vLLM
      # rejects at startup.
      enableServiceLinks: false

      nodeSelector:
        workload: gpu

      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule

      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.33.0
          imagePullPolicy: IfNotPresent
          args:
            - Qwen/Qwen2.5-7B-Instruct
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --max-model-len
            - "8192"
            - --enable-auto-tool-choice
            - --tool-call-parser
            - hermes

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          resources:
            limits:
              nvidia.com/gpu: 1

          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /root/.cache/huggingface

          # Model download + load takes several minutes on a fresh node. There is no liveness or
          # startup probe, so failures here only keep the pod out of the Service; they never
          # restart the container. 3 x 10 s of failures mark a running pod NotReady.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: hf-cache
          emptyDir: {}
