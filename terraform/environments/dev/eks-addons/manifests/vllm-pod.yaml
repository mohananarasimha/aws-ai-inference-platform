apiVersion: v1
kind: Pod
metadata:
  name: vllm
  namespace: default

spec:
  restartPolicy: Never

  nodeSelector:
    workload: gpu

  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule

  containers:
    - name: vllm
      image: vllm/vllm-openai:latest

      args:
        - Qwen/Qwen2.5-7B-Instruct
        - --host
        - "0.0.0.0"
        - --port
        - "8000"

      ports:
        - containerPort: 8000

      resources:
        limits:
          nvidia.com/gpu: 1