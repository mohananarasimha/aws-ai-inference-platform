# NOT part of the platform and not applied by up.sh. A bare single pod for a manual smoke test of
# vLLM on a GPU node (no Service, no probes, no tool-calling flags). The active workload is the
# Deployment in vllm-deploy.yaml. scripts/down.sh only deletes this pod if it was left behind.
apiVersion: v1
kind: Pod
metadata:
  name: vllm
  namespace: default

spec:
  restartPolicy: Never

  nodeSelector:
    workload: gpu

  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule

  containers:
    - name: vllm
      image: vllm/vllm-openai:v0.33.0

      args:
        - Qwen/Qwen2.5-7B-Instruct
        - --host
        - "0.0.0.0"
        - --port
        - "8000"

      ports:
        - containerPort: 8000

      resources:
        limits:
          nvidia.com/gpu: 1